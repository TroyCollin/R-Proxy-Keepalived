vrrp_script check_nginx {
    script "/usr/bin/killall -0 nginx"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eno1          # Change to your host adapter (e.g., ens18) if different
    virtual_router_id 51
    priority 101            # Higher priority wins MASTER status
    advert_int 1

    unicast_src_ip 192.168.5.45   # Node 1 Local IP
    unicast_peer {
        192.168.5.40              # Node 2 Local IP
    }

    authentication {
        auth_type PASS
        auth_pass SecretNginxClusterPass123
    }

    virtual_ipaddress {
        192.168.5.62/24 dev eno1 
    }

    track_script {
        check_nginx
    }
}

